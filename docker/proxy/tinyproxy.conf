User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Only containers on the internal sandbox network can use this proxy.
Allow 0.0.0.0/0

LogLevel Warning
MaxClients 100

# Deny everything except hosts matching /etc/tinyproxy/allowlist.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off

# CONNECT is what makes HTTPS work through the proxy. 443 only.
ConnectPort 443
