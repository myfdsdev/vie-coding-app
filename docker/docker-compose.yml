# Networks and the egress proxy. Sandbox containers are NOT defined here —
# the orchestrator creates them on demand (see run-sandbox.sh for the exact
# flags it must use). Compose owns the long-lived pieces only.
#
#   docker compose up -d
#
services:
  egress-proxy:
    build: ./proxy
    container_name: vibe-egress-proxy
    restart: unless-stopped
    networks:
      # Reachable by sandboxes...
      vibe-sandboxes:
        aliases: [egress]
      # ...and is the only thing on that path with real internet access.
      vibe-egress: {}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8888"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Added for Docker Desktop (Windows/macOS): the host cannot route to container
  # IPs there, so the orchestrator's preview proxy on :3000 forwards
  # sbx-<id>.* hostnames to this gateway. It sits on the sandbox network and
  # reaches vibe-sbx-<id>:5173 by name through Docker DNS. Published on
  # loopback only; sandboxes themselves still publish nothing. Works unchanged
  # on native Linux too.
  preview-gateway:
    image: nginx:1.27-alpine
    container_name: vibe-preview-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:8080"
    networks:
      vibe-sandboxes: {}
      vibe-gateway: {}
    configs:
      - source: gateway_conf
        target: /etc/nginx/conf.d/default.conf

configs:
  # "$$" is Compose's escape for a literal "$" (nginx variables).
  gateway_conf:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 8080 default_server;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $$sbx "";
        if ($$host ~* "^sbx-([a-z0-9]+)\.") { set $$sbx $$1; }
        location / {
          if ($$sbx = "") { return 404; }
          proxy_pass http://vibe-sbx-$$sbx:5173;
          proxy_http_version 1.1;
          proxy_set_header Host $$http_host;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_buffering off;
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
        }
      }

networks:
  # internal: true means containers on this network have NO route to the
  # internet. This is the control that stops a generated app (or a malicious
  # prompt) from exfiltrating data or mining crypto. Everything outbound must
  # go through egress-proxy, which enforces the allowlist.
  vibe-sandboxes:
    name: vibe-sandboxes
    internal: true
  vibe-egress:
    name: vibe-egress
  # Normal bridge used only to publish the preview gateway on 127.0.0.1.
  vibe-gateway:
    name: vibe-gateway
